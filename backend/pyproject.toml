[project]
name = "place-tech-platform-backend"
version = "0.1.0"
description = "FastAPI backend for a real estate reporting demo: sales, rentals, offices, marketing, data checks and a data agent. Synthetic data."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "duckdb>=1.0",
    "pandas>=2.2",
    "httpx>=0.27",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "sse-starlette>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
